<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIZQLOG</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./Resources/rl-logo.png" type="image/x-icon">
</head>
<body>
    <main class="container">
        <form id="transaction-form">
            <h2>Add New Transaction</h2>
            <label for="amount-input">Amount</label>
            <input type="number" id="amount-input" name="amount" placeholder="$12,500" required>

            <label for="category-select">Categories</label>
            <select name="category" id="category-select" required>
                <option value="" disabled selected>Rent, Groceries, Utilities....</option>
                <option value="transport">Transport</option>
                <option value="mobile-data">Mobile Data</option>
                <option value="airtime">Airtime</option>
                <option value="food">Food</option>
                <option value="groceries">groceries</option>
            </select>

            <fieldset>
                <legend>Type</legend>
                <label for="income">
                    <input type="radio" name="type" id="income" value="income" required />
                    Income
                </label>
                <label for="expense">
                    <input type="radio" name="type" id="expense" value="expense" required />
                    Expense
                </label>
            </fieldset>

            <label for="date">Date</label>
            <input type="date" name="date" id="date" required />

            <button type="submit">Save Transaction</button>

        </form>

        <section id="list-container">
            <h2>Transactions</h2>
            <ul id="transaction-list"></ul>
        </section>

        <section id="summary">
            <p id="total-income"></p>
            <p id="total-expense"></p>
            <p id="balance"></p>
        </section>

    </main>
    
    <script src="script.js"></script>
</body>
</html>
